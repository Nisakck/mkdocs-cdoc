name: CI Pipeline

on:
  push:
    branches: [main, develop, ci-pipeline]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Run tests and build
    runs-on: ubuntu-latest

    steps:
      # 1. Environment setup
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov flake8 pylint mypy mkdocs

      # 2. Static analysis
      - name: Static analysis with flake8
        run: |
          python -m flake8 mkdocs_cdoc

      - name: Static analysis with pylint
        run: |
          python -m pylint mkdocs_cdoc --errors-only

      # 3. Unit and integration tests
      - name: Run pytest tests
        run: |
          python -m pytest tests

      # 4. Coverage report
      - name: Generate coverage report
        run: |
          python -m pytest tests --cov=mkdocs_cdoc --cov-report=term-missing

      # 5. Build validation
      - name: Validate MkDocs build
        run: |
          python -m mkdocs build -f example/mkdocs.yml